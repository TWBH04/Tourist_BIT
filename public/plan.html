<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; }
        .sidebar { height: 100vh; overflow-y: auto;border-right: 5px solid #dee2e6; }
        .preview-card {
            flex: 0 0 140px;
            cursor: pointer;
        }
        .preview-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayQuest-Plan</title>
</head>
<body>
        <div class="container-fluid">
        <div class="row">
            <!-- sidebar -->
            <div class="col-md-5 sidebar p-3">
                <!-- sidebar section 1 -->
                <div id="explore-section" class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">Explore</h5>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" id="browse-all-btn">
                        Browse all</button>
                    </div>
                    <div id="preview-cards" class="d-flex gap-2 overflow-auto pb-2"></div>
                    <div id="explore-panel" class="mt-3" style="display:none;">
                        <!-- search and categories -->
                                <input type="text" class="form-control mb-2" id="search-input" placeholder="Search by name...">
                                <div id="category-buttons" class="mb-3"></div>
                        <div id="place-cards"></div>
                    </div>
                </div>

                <hr>
                <!-- sidebar secction 2 -->
                <div id="plan-section">
                    <h5>Places you selected</h5>
                    <div id="plan-summary" class="mb-2"></div>
                    <div id="plan-list">
                        <p class="text-muted">No places added yet.</p>
                    </div>
                    <button type="button" class="btn btn-success w-100 mt-3" id="start-trip-btn">
                        Confirm places
                    </button>
                </div>

            </div>
            <!-- map -->
            <div class="col-md-7 p-0">
                <div id="map"></div>
                
            </div>
        </div>
        <!-- plac detail panel -->
        <div class="offcanvas offcanvas-bottom" tabindex="-1" id="detailOffcanvas" data-bs-backdrop="false" style="height: 35vh;left: 41.6667%;">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="detail-name"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body" id="detail-body">
                <!-- JS part -->
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const map = L.map('map').setView([6.713, 79.906], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // places fetch to cards and markersd
        let markers = [];
        function loadPlaces(url = '../api/places.php') {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    renderMarkers(data.places);
                    renderCards(data.places);
                });
        }

        // markers on map
        function renderMarkers(places) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            places.forEach(place => {
                const marker = L.marker([place.latitude, place.longitude]).addTo(map);
                marker.bindPopup(`<strong>${place.name}</strong>`);
                marker.on('click', () => showPlaceDetail(place.place_id));
                markers.push(marker);
            });
        }

        // cards of places
        function renderCards(places){
            renderPreviewCards(places);
            renderAllCards(places);
        }

        function renderPreviewCards(places) {
            const preview = places.slice(0, 3);
            const container = document.getElementById('preview-cards');
            const placeholderImg = 'https://placehold.co/300x200?text=DayQuest';
            container.innerHTML = preview.map(place => `
            <div class="preview-card place-card" data-place-id="${place.place_id}" style="cursor:pointer;">
                <img src="${place.thumbnail || placeholderImg}" alt="${place.name}">
                <h6 class="mt-1 mb-0" style="font-size: 0.85rem;">${place.name}</h6>
                <p class="text-muted mb-0" style="font-size: 0.75rem;">${place.category_name} &middot; ${place.distance_from_panadura} km</p>
            </div>
            `).join('');
                container.querySelectorAll('.place-card').forEach(card => {
                card.addEventListener('click', () => showPlaceDetail(card.dataset.placeId));
            });
        }

        function renderAllCards(places) {
            const container = document.getElementById('place-cards');
            const placeholderImg = 'https://placehold.co/300x200?text=DayQuest';
            container.innerHTML = places.map(place => `
                <div class="card mb-2 place-card" data-place-id="${place.place_id}" style="cursor:pointer;">
                    <div class="d-flex">
                        <img src="${place.thumbnail || placeholderImg}" alt="${place.name}" style="width:80px; height:80px; object-fit:cover; border-radius:4px 0 0 4px;">
                        <div class="card-body p-2">
                            <h6 class="card-title mb-1">${place.name}</h6>
                            <p class="card-text small text-muted mb-0">${place.category_name} &middot; ${place.distance_from_panadura} km</p>
                        </div>
                    </div>
                </div>
            `).join('');
                container.querySelectorAll('.place-card').forEach(card => {
                card.addEventListener('click', () => showPlaceDetail(card.dataset.placeId));
            });
        }

        // browseall switch
        let activeCategory = null;
        document.getElementById('browse-all-btn').addEventListener('click', () => {
            const preview = document.getElementById('preview-cards');
            const panel = document.getElementById('explore-panel');
            const isOpening = panel.style.display === 'none';
            console.log('isOpening:', isOpening, 'panel display was:', panel.style.display);

            panel.style.display = isOpening ? 'block' : 'none';
            preview.classList.toggle('d-none', isOpening);
        });
        
        fetch('../api/category.php')
            .then(response => response.json())
            .then(data => renderCategoryButtons(data.categories));

        function renderCategoryButtons(categories) {
            const container = document.getElementById('category-buttons');
            container.innerHTML = categories.map(cat => `
                <button type="button" class="btn btn-outline-success btn-sm me-1 mb-1 category-btn" data-id="${cat.category_id}">
                    ${cat.category_name}
                </button>
            `).join('');

            container.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    activeCategory = (activeCategory === id) ? null : id;

                    container.querySelectorAll('.category-btn').forEach(b => b.classList.remove('btn-success', 'text-white'));
                    if (activeCategory !== null) {
                        btn.classList.add('btn-success', 'text-white');
                    }

                    applyFilters();
                });
            });
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);

        function applyFilters() {
            const params = new URLSearchParams();
            if (activeCategory !== null) params.set('category', activeCategory);
            const keyword = document.getElementById('search-input').value.trim();
            if (keyword) params.set('q', keyword);

            loadPlaces(`../api/places.php?${params.toString()}`);
        }

        loadPlaces();

        // place details script
        function showPlaceDetail(placeId) {
            fetch(`../api/place.php?id=${placeId}`)
                .then(response => response.json())
                .then(data => renderDetail(data.place));
        }

        function renderDetail(place) {
            document.getElementById('detail-name').textContent = place.name;

            document.getElementById('detail-body').innerHTML = `
                <p>${place.description || ''}</p>
                <ul class="list-unstyled small">
                    <li><strong>Category:</strong> ${place.category_name}</li>
                    <li><strong>Opening hours:</strong> ${place.opening_hours || 'Not available'}</li>
                    <li><strong>Average visit duration:</strong> ${place.visit_duration} minutes</li>
                    <li><strong>Distance from Panadura:</strong> ${place.distance_from_panadura} km</li>
                    <li><strong>Entrance fee:</strong> ${place.entrance_fee || 'Not available'}</li>
                    <li><strong>Accessibility:</strong> ${place.accessibility_info || 'Not available'}</li>
                    <li><strong>Travel tips:</strong> ${place.travel_tips || 'Not available'}</li>
                </ul>
                <button type="button" class="btn btn-success w-100" id="add-to-plan-btn" data-place-id="${place.place_id}">
                    Add to Plan
                </button>
            `;
            // map zoom in 
            map.setView([place.latitude, place.longitude], 14);

            const offcanvas = new bootstrap.Offcanvas(document.getElementById('detailOffcanvas'));
            offcanvas.show();

            document.getElementById('add-to-plan-btn').addEventListener('click', () => {
                addToPlan(place.place_id);
            });
        }

        // Add place to plan and local storage
        const PLAN_KEY = 'DayQuestPlan';   

        function getPlan() {
            const saved = localStorage.getItem(PLAN_KEY);
            if (saved) return JSON.parse(saved);

            // fallback, in case someone lands here with no plan started yet
            return { plan_name: 'Visit Plan', date: '', start_time: '', end_time: '', places: [] };
        }

        function savePlan(plan) {
            localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
        }

        function addToPlan(placeId) {
            const plan = getPlan();

            const alreadyAdded = plan.places.some(p => p.place_id === placeId);
            if (alreadyAdded) {
                alert('This place is already in your plan.');
                return;
            }

            const nextOrder = plan.places.length + 1;
            plan.places.push({ place_id: placeId, order: nextOrder, visited: false });

            savePlan(plan);
            renderPlanList();

            const offcanvasEl = document.getElementById('detailOffcanvas');
            bootstrap.Offcanvas.getInstance(offcanvasEl).hide();
        }
        // selected plans list
        function renderPlanList() {
            const plan = getPlan();
            const container = document.getElementById('plan-list');

            if (plan.places.length === 0) {
                container.innerHTML = '<p class="text-muted">No places added yet.</p>';
                return;
            }

            container.innerHTML = '<p class="text-muted">Loading...</p>';

            Promise.all(
                plan.places.map(p => fetch(`../api/place.php?id=${p.place_id}`).then(r => r.json()))
            ).then(results => {
                const totalVisitMinutes = results.reduce((sum, res) => sum + res.place.visit_duration, 0);
                renderPlanSummary(plan, totalVisitMinutes);
                container.innerHTML = results.map((res, i) => `
                    <div class="card mb-2">
                        <div class="card-body p-2 d-flex justify-content-between align-items-center">
                            <span>${plan.places[i].order}. ${res.place.name}</span>
                            <div>
                                <button type="button" class="btn btn-sm btn-outline-secondary move-up-btn" data-place-id="${res.place.place_id}" ${i === 0 ? 'disabled' : ''}>
                                    <i class="bi bi-arrow-up"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary move-down-btn" data-place-id="${res.place.place_id}" ${i === results.length - 1 ? 'disabled' : ''}>
                                    <i class="bi bi-arrow-down"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger remove-place-btn" data-place-id="${res.place.place_id}">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('.remove-place-btn').forEach(btn => {
                    btn.addEventListener('click', () => removeFromPlan(parseInt(btn.dataset.placeId)));
                });
                container.querySelectorAll('.move-up-btn').forEach(btn => {
                    btn.addEventListener('click', () => movePlace(parseInt(btn.dataset.placeId), -1));
                });
                container.querySelectorAll('.move-down-btn').forEach(btn => {
                    btn.addEventListener('click', () => movePlace(parseInt(btn.dataset.placeId), 1));
                });
            });
        }
        // removing place from list
        function removeFromPlan(placeId) {
            const plan = getPlan();
            plan.places = plan.places.filter(p => p.place_id !== placeId);
            plan.places.forEach((p, i) => p.order = i + 1);   
            savePlan(plan);
            renderPlanList();
        }
        // move place in list
        function movePlace(placeId, direction) {
            const plan = getPlan();
            const index = plan.places.findIndex(p => p.place_id === placeId);
            const swapIndex = index + direction;

            if (swapIndex < 0 || swapIndex >= plan.places.length) return;

            [plan.places[index], plan.places[swapIndex]] = [plan.places[swapIndex], plan.places[index]];

            plan.places.forEach((p, i) => p.order = i + 1);

            savePlan(plan);
            renderPlanList();
        }

        renderPlanList();   // run once on page load, in case a plan already has places

        // plan time and remaining time calculation 
        function timeStringToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function renderPlanSummary(plan, totalVisitMinutes) {
                const summaryEl = document.getElementById('plan-summary');
                if (!plan.start_time || !plan.end_time) {
                    summaryEl.innerHTML = `<p class="small text-muted">Total visit time: ${formatMinutes(totalVisitMinutes)}</p>`;
                    return;
                }

                const availableMinutes = timeStringToMinutes(plan.end_time) - timeStringToMinutes(plan.start_time);
                const percentUsed = totalVisitMinutes / availableMinutes;
                const timeText = formatMinutes(totalVisitMinutes);
                const windowText = `${plan.start_time}–${plan.end_time}`;
                const travelNote = `Travel time between stops isn't included here.`;

                if (percentUsed > 1) {
                    summaryEl.innerHTML = `
                        <p class="small text-danger fw-bold mb-0">
                            Total visit time (${timeText}) exceeds your ${windowText} window. ${travelNote}
                        </p>`;
                } else if (percentUsed >= 0.8) {
                    summaryEl.innerHTML = `
                        <p class="small text-warning fw-bold mb-0">
                            You're nearing your ${windowText} window (${timeText} so far). ${travelNote}
                        </p>`;
                } else {
                    summaryEl.innerHTML = `
                        <p class="small text-muted mb-0">
                            Total visit time: ${timeText}, within your ${windowText} window.
                        </p>`;
                }
            }

        function formatMinutes(totalMinutes) {
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            return `${hours}h ${mins}m`;
        }

        // strt trip button
        document.getElementById('start-trip-btn').addEventListener('click', () => {
        const plan = getPlan();

        if (plan.places.length === 0) {
            alert('Add at least one place to your plan before starting your trip.');
            return;
        }
        plan.trip_started = false;
        savePlan(plan);
        window.location.href = 'trip.html';
    });
    </script>
</body>
</html>
