<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; }
        .sidebar { height: 100vh; overflow-y: auto;border-right: 5px solid #dee2e6; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayQuest-Plan</title>
</head>
<body>
        <div class="container-fluid">
        <div class="row">

            <div class="col-md-5 sidebar p-3">

                <div id="explore-section" class="mb-4">
                    <h5>Explore</h5>
                    <button type="button" class="btn btn-outline-secondary w-100" id="browse-all-btn">
                        Browse all
                    </button>
                    <div id="explore-panel" class="mt-3" style="display:none;">
                        <!-- search and categories -->
                    </div>
                </div>

                <hr>

                <div id="plan-section">
                    <h5>Places you selected</h5>
                    <div id="plan-list">
                        <p class="text-muted">No places added yet.</p>
                    </div>
                    <button type="button" class="btn btn-success w-100 mt-3" id="start-trip-btn">
                        Start Trip
                    </button>
                </div>

            </div>

            <div class="col-md-7 p-0">
                <div id="map"></div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const map = L.map('map').setView([6.713, 79.906], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);
    </script>
</body>
</html>
