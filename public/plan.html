<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        html, body { height: 100%; margin: 0; }
        #map { height: 100vh; }
        .sidebar { height: 100vh; overflow-y: auto;border-right: 5px solid #dee2e6; }
        .preview-card {
            flex: 0 0 140px;
            cursor: pointer;
        }
        .preview-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayQuest-Plan</title>
</head>
<body>
        <div class="container-fluid">
        <div class="row">

            <div class="col-md-5 sidebar p-3">

                <div id="explore-section" class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">Explore</h5>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" id="browse-all-btn">
                        Browse all</button>
                    </div>
                    <div id="preview-cards" class="d-flex gap-2 overflow-auto pb-2"></div>
                    <div id="explore-panel" class="mt-3" style="display:none;">
                        <!-- search and categories -->
                                <input type="text" class="form-control mb-2" id="search-input" placeholder="Search by name...">
                                <div id="category-buttons" class="mb-3"></div>
                        <div id="place-cards"></div>
                    </div>
                </div>

                <hr>

                <div id="plan-section">
                    <h5>Places you selected</h5>
                    <div id="plan-list">
                        <p class="text-muted">No places added yet.</p>
                    </div>
                    <button type="button" class="btn btn-success w-100 mt-3" id="start-trip-btn">
                        Start Trip
                    </button>
                </div>

            </div>

            <div class="col-md-7 p-0">
                <div id="map"></div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const map = L.map('map').setView([6.713, 79.906], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);
    // places fetch to cards and markersd
    let markers = [];
    function loadPlaces(url = '../api/places.php') {
        fetch(url)
            .then(response => response.json())
            .then(data => {
                renderMarkers(data.places);
                renderCards(data.places);
            });
    }
    // markers on map
    function renderMarkers(places) {
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        places.forEach(place => {
            const marker = L.marker([place.latitude, place.longitude]).addTo(map);
            marker.bindPopup(`<strong>${place.name}</strong>`);
            markers.push(marker);
        });
    }
    // cards of places
    function renderCards(places){
        renderPreviewCards(places);
        renderAllCards(places);
    }

    function renderPreviewCards(places) {
        const preview = places.slice(0, 3);
        const container = document.getElementById('preview-cards');
        const placeholderImg = 'https://placehold.co/300x200?text=DayQuest';
        container.innerHTML = preview.map(place => `
        <div class="preview-card">
            <img src="${place.thumbnail || placeholderImg}" alt="${place.name}">
            <h6 class="mt-1 mb-0" style="font-size: 0.85rem;">${place.name}</h6>
            <p class="text-muted mb-0" style="font-size: 0.75rem;">${place.category_name} &middot; ${place.distance_from_panadura} km</p>
        </div>
        `).join('');
    }

    function renderAllCards(places) {
        const container = document.getElementById('place-cards');
        const placeholderImg = 'https://placehold.co/300x200?text=DayQuest';
        container.innerHTML = places.map(place => `
            <div class="card mb-2">
                <div class="d-flex">
                    <img src="${place.thumbnail || placeholderImg}" alt="${place.name}" style="width:80px; height:80px; object-fit:cover; border-radius:4px 0 0 4px;">
                    <div class="card-body p-2">
                        <h6 class="card-title mb-1">${place.name}</h6>
                        <p class="card-text small text-muted mb-0">${place.category_name} &middot; ${place.distance_from_panadura} km</p>
                    </div>
                </div>
            </div>
        `).join('');
    }
    // browseall switch
    let activeCategory = null;
    document.getElementById('browse-all-btn').addEventListener('click', () => {
        const preview = document.getElementById('preview-cards');
        const panel = document.getElementById('explore-panel');
        const isOpening = panel.style.display === 'none';
        console.log('isOpening:', isOpening, 'panel display was:', panel.style.display);

        panel.style.display = isOpening ? 'block' : 'none';
        preview.classList.toggle('d-none', isOpening);
    });

    fetch('../api/category.php')
        .then(response => response.json())
        .then(data => renderCategoryButtons(data.categories));

    function renderCategoryButtons(categories) {
        const container = document.getElementById('category-buttons');
        container.innerHTML = categories.map(cat => `
            <button type="button" class="btn btn-outline-success btn-sm me-1 mb-1 category-btn" data-id="${cat.category_id}">
                ${cat.category_name}
            </button>
        `).join('');

        container.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                activeCategory = (activeCategory === id) ? null : id;

                container.querySelectorAll('.category-btn').forEach(b => b.classList.remove('btn-success', 'text-white'));
                if (activeCategory !== null) {
                    btn.classList.add('btn-success', 'text-white');
                }

                applyFilters();
            });
        });
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);

    function applyFilters() {
        const params = new URLSearchParams();
        if (activeCategory !== null) params.set('category', activeCategory);
        const keyword = document.getElementById('search-input').value.trim();
        if (keyword) params.set('q', keyword);

        loadPlaces(`../api/places.php?${params.toString()}`);
    }

    loadPlaces();
    </script>
</body>
</html>
